[package]
name = "utopia-migration"
description = "Moves resources between services: sources (Appwrite, Supabase, NHost, Firebase, CSV, JSON) and destinations (Appwrite, CSV, JSON, a local backup), with the transfer, its cache and status counters."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"

[features]
default = ["firebase", "nhost"]
# The Firebase source (RS256 service account JWTs on OpenSSL).
firebase = ["dep:openssl"]
# The NHost and Supabase sources (PostgreSQL through tokio-postgres).
nhost = ["dep:tokio-postgres"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
indexmap = "2"
openssl = { version = "0.10", optional = true }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util", "rt"] }
tokio-postgres = { version = "0.7.12", optional = true, features = ["with-chrono-0_4", "with-serde_json-1"] }
utopia-client = { version = "0.1.0", git = "https://github.com/utopia-rs/client" }
utopia-database = { version = "0.1.0", git = "https://github.com/utopia-rs/database", features = ["memory"] }
utopia-storage = { version = "0.1.0", git = "https://github.com/utopia-rs/storage" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }

[package.metadata.utopia]
php-sync = ""